name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-locales.py
      - run: python3 scripts/check.py
      - name: Require up-to-date generated output
        run: git diff --exit-code -- dist/index.html dist/zh.html dist/data.zh.js
